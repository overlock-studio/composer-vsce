apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappenvs.example.org
spec:
  group: example.org
  names:
    kind: XAppEnv
    plural: xappenvs
  claimNames:
    kind: AppEnv
    plural: appenvs
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - region
              properties:
                region:
                  type: string
                  description: GCP region (zone derived as <region>-a)
                machineType:
                  type: string
                  default: e2-medium
                bucketLocation:
                  type: string
                  default: US
            status:
              type: object
              properties:
                bucketUrl:
                  type: string
